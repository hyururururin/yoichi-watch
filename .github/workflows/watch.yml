name: yoichi-watch

on:
  schedule:
    - cron: "7,22,37,52 * * * *"   # 15分間隔。混雑する毎時0分ちょうどを避けて分をずらしている
  workflow_dispatch:
    inputs:
      mode:
        description: "実行モード"
        type: choice
        options: [check, dump]
        default: check

concurrency:
  group: yoichi-watch
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Restore state
        uses: actions/cache/restore@v4
        with:
          path: state.json
          key: yoichi-state-${{ github.run_id }}
          restore-keys: yoichi-state-

      - name: Run
        env:
          # 単独 / 範囲(2026-10-18..2026-10-20) / * (予約可能期間すべて) を併用可
          TARGET_DATES: "2026-10-18"
          # キーモルト / 通常見学 / 空=全コース
          TOUR_KEYWORD: "キーモルト"
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          MIN_INTERVAL: "1800"
          LOOP_MINUTES: "50"     # 1回の起動で粘る時間
          LOOP_INTERVAL: "300"   # その間のチェック間隔（秒）
        run: |
          if [ "${{ inputs.mode }}" = "dump" ]; then
            python check_yoichi.py --dump
            exit 0
          fi
          END=$(( $(date +%s) + LOOP_MINUTES * 60 ))
          N=0
          while [ "$(date +%s)" -lt "$END" ]; do
            N=$((N + 1))
            echo "----- 巡回 $N / $(date -u -d '+9 hours' '+%H:%M') JST -----"
            python check_yoichi.py || echo "[warn] この回は失敗。継続します"
            REMAIN=$(( END - $(date +%s) ))
            [ "$REMAIN" -le "$LOOP_INTERVAL" ] && break
            sleep "$LOOP_INTERVAL"
          done
          echo "----- 巡回終了（計 $N 回）-----"

      - name: Upload debug files
        if: inputs.mode == 'dump'
        uses: actions/upload-artifact@v4
        with:
          name: yoichi-debug
          path: debug/
          retention-days: 7

      - name: Save state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: state.json
          key: yoichi-state-${{ github.run_id }}
